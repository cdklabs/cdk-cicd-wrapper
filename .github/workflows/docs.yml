name: docs
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs
        run: ./scripts/build-docs
        working-directory: docs
      - name: Publish to gh-pages
        run: .venv/bin/mkdocs gh-deploy --force
        working-directory: docs/build/docs
