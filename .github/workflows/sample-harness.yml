name: sample-harness
on:
  pull_request:
    paths:
      - samples/**
      - test/harness/**
  push:
    branches:
      - main
    paths:
      - samples/**
      - test/harness/**
  workflow_dispatch: {}
jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python3 -m pip install pip-audit
      - name: Unit-test the runtime policy
        run: node --test test/harness/check-samples.test.mjs
      - name: Run the sample harness
        run: bash test/harness/check-samples.sh
